baseURL = 'https://blog.enkr1.com/'
languageCode = 'en-us'
title = "ENKR's Blog | Jing Hui PANG"
theme = 'stack'
copyright = 'ENKR'
timeZone = 'Asia/Singapore'
disqusShortname = 'https-enkr1-github-io-blog'
timeout = '300s'  # 5 minutes for image-heavy pages
enableGitInfo = true  # Use git commit date for .Lastmod

# Theme i18n support
DefaultContentLanguage = 'en'
hasCJKLanguage = false

# Pagination
[pagination]
pagerSize = 10

# Permalinks
[permalinks]
posts = '/:slug/'
journals = '/journals/:slug/'
page = '/:slug/'

# Main params
[params]
googleClientId = "71411607593-s5b8k4j2gt2laqhrjvvrklu3rt04ci4k.apps.googleusercontent.com"
mainSections = ['posts', 'journals']
featuredImageField = 'image'
rssFullContent = true
description = "Personal blog by Jing Hui PANG—journaling my journey in programming, beatboxing, and personal growth. Tech tips, music stories, and life insights."
favicon = "/favicon.svg"
[params.author]
name = "Jing Hui PANG | 彭竞辉 | ENKR"
email = ""
keywords = ['ENKR', 'Jing Hui PANG', 'Pang Jing Hui', '彭竞辉', 'Beatbox', 'ByteDance', 'ByteDancer', '字节跳动', 'Beatboxing artist', 'Programming', 'Software Engineering', 'Full-Stack Development', 'Elixir programming', 'JavaScript', 'PHP', 'Singapore tech community', '555 Beatbox Initiative', 'Beatbox battles', 'ByteDance engineer', 'Tech and music integration', 'Technology', 'Music', 'UI/UX Design', 'Web development', 'DevOps', 'Cloud technologies', 'AWS', 'Terraform', 'MySQL', 'PostgreSQL', 'Singapore beatboxer', 'Esh', 'We are rising 555']

[params.opengraph.twitter]
site = "enkr999"
card = "summary_large_image"

[params.footer]
since = 2023
[params.footer.visitorCount]
enabled = true
placeholder = "..."
label = "visitors"

[params.dateFormat]
published = 'Jan 02, 2006 · 3:04 PM'
lastUpdated = '2 Jan 2006 · 3:04 PM'

[params.layout]
floatingSidebars = true

[params.sidebar]
emoji = ''
subtitle = "If you actually try your best, you can't lose. 🎯"

[params.sidebar.avatar]
enabled = true
local = true
src = 'img/avatar.png'

[params.sidebar.visitorCount]
enabled = true
placeholder = "..."
label = "visitors"

[params.article]
math = true
toc = true
readingTime = true
[params.article.license]
enabled = false

[params.comments]
enabled = true
provider = 'disqus'

[params.comments.disqusjs]
shortname = 'https-enkr1-github-io-blog'

# Widgets
[params.widgets]
[[params.widgets.homepage]]
type = 'search'

[[params.widgets.homepage]]
type = 'tag-cloud'
[params.widgets.homepage.params]
limit = 7

[[params.widgets.homepage]]
type = 'archives'
[params.widgets.homepage.params]
limit = 5

[[params.widgets.page]]
type = 'toc'

[[params.widgets.page]]
type = 'search'

[[params.widgets.page]]
type = 'tag-cloud'
[params.widgets.page.params]
limit = 7

# Color scheme - dark mode enabled
[params.colorScheme]
toggle = true
default = 'auto'

# Theme image processing
[params.imageProcessing]
[params.imageProcessing.cover]
enabled = true
[params.imageProcessing.content]
enabled = true

# Menu
[menu]
[[menu.main]]
identifier = 'home'
name = 'Home'
url = '/'
weight = 1
[menu.main.params]
icon = 'home'

[[menu.main]]
identifier = 'journals'
name = 'Journals'
url = '/journals/'
weight = 3
[menu.main.params]
icon = 'journal'

[[menu.main]]
identifier = 'categories'
name = 'Categories'
url = '/categories/'
weight = 4
[menu.main.params]
icon = 'categories'

[[menu.main]]
identifier = 'platforms'
name = 'Platforms'
url = 'https://enkr1.github.io/platforms/'
weight = 5
[menu.main.params]
icon = 'link'
newTab = true

# Mobile bottom nav (subset of menu.main — update both if URLs/icons change)
[[menu.mobile]]
identifier = 'home'
name = 'Home'
url = '/'
weight = 1
[menu.mobile.params]
icon = 'home'

[[menu.mobile]]
identifier = 'journals'
name = 'Journals'
url = '/journals/'
weight = 2
[menu.mobile.params]
icon = 'journal'

[[menu.mobile]]
identifier = 'platforms'
name = 'Platforms'
url = 'https://enkr1.github.io/platforms/'
weight = 4
[menu.mobile.params]
icon = 'link'
newTab = true

# Related posts
[related]
includeNewer = true
threshold = 60
toLower = false

[[related.indices]]
name = 'tags'
weight = 100

[[related.indices]]
name = 'categories'
weight = 200

# Markup settings
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 4
ordered = false
startLevel = 2

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNoStart = 1
lineNos = true
lineNumbersInTable = false  # Inline for good spacing, JS handles copy
tabWidth = 4

# Google Analytics
[services]
[services.googleAnalytics]
ID = 'G-4N4L18VB12'
