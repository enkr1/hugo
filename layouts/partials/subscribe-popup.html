{{/* Subscribe Banner — slim fixed top bar, dismissable */}}
<div class="subscribe-banner" id="subscribe-banner" role="banner" hidden>
    <div class="subscribe-banner__inner">
        <span class="subscribe-banner__text">Stay in the loop</span>

        <form class="subscribe-banner__form" id="subscribe-banner-form" autocomplete="off">
            <label for="subscribe-banner-email" class="visually-hidden">Email address</label>
            <input
                id="subscribe-banner-email"
                type="email"
                name="email"
                class="subscribe-banner__input"
                placeholder="your@email.com"
                autocomplete="email"
                required
            />
            <button type="submit" class="subscribe-banner__submit" aria-label="Subscribe">
                <span>Subscribe</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>

        <div class="subscribe-banner__feedback" id="subscribe-banner-feedback"
             role="status" aria-live="polite" hidden></div>

        <button class="subscribe-banner__close" id="subscribe-banner-close"
                type="button" aria-label="Dismiss subscribe banner">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>
</div>

<script>
(function() {
    var ENDPOINT = 'https://script.google.com/macros/s/AKfycbwEzLvqwcJL5aWI0q8qqTH9Ozn9bJOEhAw72zIKe6fVxI7pRWGMf43N-2vSTnHC5jjOOA/exec';
    var DISMISS_DAYS = 7;
    var BOT_THRESHOLD = 3000;

    if (localStorage.getItem('blog_subscribed')) return;
    var dismissed = localStorage.getItem('subscribe_popup_dismissed');
    if (dismissed && (Date.now() - Number(dismissed)) < DISMISS_DAYS * 24 * 60 * 60 * 1000) return;

    var banner = document.getElementById('subscribe-banner');
    var form = document.getElementById('subscribe-banner-form');
    var emailInput = document.getElementById('subscribe-banner-email');
    var feedback = document.getElementById('subscribe-banner-feedback');
    var closeBtn = document.getElementById('subscribe-banner-close');
    if (!banner || !form || !emailInput || !feedback || !closeBtn) return;

    var loadTime = Date.now();

    var maxScroll = 0;
    window.addEventListener('scroll', function() {
        var scrolled = window.scrollY + window.innerHeight;
        var total = document.documentElement.scrollHeight;
        var pct = Math.round((scrolled / total) * 100);
        if (pct > maxScroll) maxScroll = pct;
    }, { passive: true });

    banner.hidden = false;
    setTimeout(function() {
        banner.classList.add('subscribe-banner--visible');
    }, 20);

    function dismiss() {
        localStorage.setItem('subscribe_popup_dismissed', String(Date.now()));
        banner.classList.remove('subscribe-banner--visible');
        setTimeout(function() { banner.hidden = true; }, 300);
    }

    closeBtn.addEventListener('click', dismiss);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !banner.hidden) {
            dismiss();
        }
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        var isBot = (Date.now() - loadTime) < BOT_THRESHOLD;
        var email = emailInput.value.trim();
        var submitBtn = form.querySelector('.subscribe-banner__submit');
        var isMobile = window.matchMedia('(max-width: 1023px)').matches;

        submitBtn.disabled = true;
        feedback.hidden = true;

        var params = new URLSearchParams(window.location.search);

        fetch(ENDPOINT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                email: email,
                page_url: window.location.href,
                page_title: document.title,
                referrer: document.referrer || '(direct)',
                device: isMobile ? 'mobile' : 'desktop',
                screen: window.innerWidth + 'x' + window.innerHeight,
                time_on_page: Math.round((Date.now() - loadTime) / 1000),
                locale: navigator.language || '',
                scroll_depth: maxScroll,
                utm_source: params.get('utm_source') || '',
                utm_medium: params.get('utm_medium') || '',
                utm_campaign: params.get('utm_campaign') || '',
                source: 'banner',
                website: isBot ? 'bot' : ''
            })
        })
        .then(function() {
            localStorage.setItem('blog_subscribed', 'true');
            feedback.textContent = "You're in! Thanks for subscribing.";
            feedback.className = 'subscribe-banner__feedback subscribe-banner__feedback--ok';
            feedback.hidden = false;
            form.hidden = true;
            setTimeout(dismiss, 3000);
        })
        .catch(function() {
            feedback.textContent = 'Something went wrong. Please try again.';
            feedback.className = 'subscribe-banner__feedback subscribe-banner__feedback--error';
            feedback.hidden = false;
        })
        .finally(function() {
            submitBtn.disabled = false;
        });
    });
})();
</script>
