{{/* Subscribe Popup — desktop-only floating card, premium Ba Zi design */}}
<div class="subscribe-popup" id="subscribe-popup">
    <button class="subscribe-popup__close" id="subscribe-popup-close" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <h3 class="subscribe-popup__title">Stay in the loop</h3>
    <p class="subscribe-popup__desc">Get notified when I publish something new.</p>

    <form class="subscribe-popup__form" id="subscribe-popup-form" autocomplete="off">
        <div class="subscribe-popup__field">
            <input
                type="email"
                name="email"
                class="subscribe-popup__input"
                placeholder="your@email.com"
                required
                aria-label="Email address"
            />
            <button type="submit" class="subscribe-popup__submit" aria-label="Subscribe">
                <span>Subscribe</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </form>

    <div class="subscribe-popup__feedback" id="subscribe-popup-feedback" hidden></div>
</div>
