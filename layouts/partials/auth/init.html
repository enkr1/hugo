{{/* Auth — site-wide Google One Tap + sidebar login */}}
{{- with resources.Get "ts/auth-entry.ts" -}}
    {{- $opts := dict "minify" hugo.IsProduction "target" "es2020" -}}
    {{- $authEntry := . | js.Build $opts | fingerprint -}}
    <script type="module" src="{{ $authEntry.RelPermalink }}"></script>
{{- end -}}
